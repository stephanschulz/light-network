<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edge Network 3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; overflow: hidden; font-family: monospace; color: #ccc; }
  canvas { display: block; }
  #info {
    position: absolute; top: 12px; left: 12px;
    background: rgba(0,0,0,0.7); padding: 10px 14px; border-radius: 6px;
    font-size: 13px; line-height: 1.6; pointer-events: none;
  }
  #info .label { color: #888; }
  #status {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 16px; color: #aaa; display: none;
  }
</style>
</head>
<body>
<div id="info">
  <span class="label">Edges:</span> <span id="edgeCount">0</span> &nbsp;
  <span class="label">Nodes:</span> <span id="nodeCount">0</span>
  (<span style="color:#ff7043" id="intercomCount">0</span> <span class="label">Intercom,</span>
   <span style="color:#4fc3f7" id="artnetCount">0</span> <span class="label">ArtNet,</span>
   <span style="color:#aaa" id="regularCount">0</span> <span class="label">Regular</span>)<br>
  <span class="label">Drag to rotate · Scroll to zoom · Right-drag to pan</span>
</div>
<div id="status">Loading CSV…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.162.0",
    "three/addons/": "https://esm.sh/three@0.162.0/examples/jsm/",
    "lil-gui": "https://esm.sh/lil-gui@0.19.2"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import GUI from 'lil-gui';

const statusEl = document.getElementById('status');
function showStatus(msg) { statusEl.style.display = 'block'; statusEl.textContent = msg; }
function hideStatus() { statusEl.style.display = 'none'; }

async function loadCSV() {
  showStatus('Loading CSV…');
  const resp = await fetch('edge_data_export.csv');
  if (!resp.ok) throw new Error(`Failed to load CSV: ${resp.status}`);
  const text = await resp.text();
  const lines = text.trim().split('\n');
  const edges = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',');
    if (cols.length < 24) continue;
    const startNodeId = +cols[5];
    const endNodeId   = +cols[11];
    const flowStartId = cols[22].trim();
    const flowEndId   = cols[23].trim();
    let flowReversed = false;
    if (flowStartId !== 'No Flow' && flowEndId !== 'No Flow') {
      flowReversed = (+flowStartId === endNodeId);
    }
    edges.push({
      id: +cols[0],
      start: new THREE.Vector3(+cols[1], +cols[3], +cols[2]),
      startType: cols[4].trim(),
      startLabel: cols[6].trim(),
      end:   new THREE.Vector3(+cols[7], +cols[9], +cols[8]),
      endType: cols[10].trim(),
      endLabel: cols[12].trim(),
      length: +cols[13],
      ringDiameter: +cols[15],
      stripStart: new THREE.Vector3(+cols[16], +cols[18], +cols[17]),
      stripEnd:   new THREE.Vector3(+cols[19], +cols[21], +cols[20]),
      flowReversed,
      hasFlow: flowStartId !== 'No Flow',
    });
  }
  return edges;
}

function collectNodes(edges) {
  const nodeMap = new Map();
  for (const e of edges) {
    const pairs = [
      { pt: e.start, type: e.startType, label: e.startLabel },
      { pt: e.end,   type: e.endType,   label: e.endLabel },
    ];
    for (const { pt, type, label } of pairs) {
      const key = `${pt.x.toFixed(4)},${pt.y.toFixed(4)},${pt.z.toFixed(4)}`;
      if (!nodeMap.has(key)) {
        nodeMap.set(key, { position: pt.clone(), type, label, diameter: e.ringDiameter });
      }
    }
  }
  return nodeMap;
}

function buildScene(edges) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  const groups = {
    edges: new THREE.Group(),
    strips: new THREE.Group(),
    arrows: new THREE.Group(),
    normalRings: new THREE.Group(),
    intercomRings: new THREE.Group(),
    nodes: new THREE.Group(),
    labels: new THREE.Group(),
  };
  for (const [k, g] of Object.entries(groups)) { g.name = k; scene.add(g); }

  const colorIntercom = new THREE.Color(0xff7043);
  const colorArtNet    = new THREE.Color(0x4fc3f7);
  const colorRegular   = new THREE.Color(0x888888);

  function edgeColor(e) {
    if (e.startType === 'Intercom' || e.endType === 'Intercom') return colorIntercom;
    return colorArtNet;
  }
  function edgeStripColor(e) {
    if (e.startType === 'Intercom' || e.endType === 'Intercom') return new THREE.Color(0xffab91);
    return new THREE.Color(0x80deea);
  }

  // --- Thin edge lines ---
  const edgeBuckets = { intercom: [], other: [] };
  for (const e of edges) {
    const bucket = (e.startType === 'Intercom' || e.endType === 'Intercom') ? edgeBuckets.intercom : edgeBuckets.other;
    bucket.push(e.start.x, e.start.y, e.start.z, e.end.x, e.end.y, e.end.z);
  }

  function makeLineSegments(positions, color) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    return new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color, linewidth: 1 }));
  }

  if (edgeBuckets.other.length) groups.edges.add(makeLineSegments(edgeBuckets.other, colorArtNet));
  if (edgeBuckets.intercom.length) groups.edges.add(makeLineSegments(edgeBuckets.intercom, colorIntercom));

  // --- Fat strip / LED tube lines ---
  const stripBuckets = { intercom: [], other: [] };
  for (const e of edges) {
    const bucket = (e.startType === 'Intercom' || e.endType === 'Intercom') ? stripBuckets.intercom : stripBuckets.other;
    bucket.push(e.stripStart.x, e.stripStart.y, e.stripStart.z, e.stripEnd.x, e.stripEnd.y, e.stripEnd.z);
  }

  function makeFatLineSegments(positions, color, width) {
    const geo = new LineSegmentsGeometry();
    geo.setPositions(positions);
    const mat = new LineMaterial({ color: color.getHex(), linewidth: width, worldUnits: true });
    return new Line2(geo, mat);
  }

  const stripMaterials = [];
  const defaultTubeWidth = 0.35;
  if (stripBuckets.other.length) {
    const line = makeFatLineSegments(stripBuckets.other, new THREE.Color(0x80deea), defaultTubeWidth);
    stripMaterials.push(line.material);
    groups.strips.add(line);
  }
  if (stripBuckets.intercom.length) {
    const line = makeFatLineSegments(stripBuckets.intercom, new THREE.Color(0xffab91), defaultTubeWidth);
    stripMaterials.push(line.material);
    groups.strips.add(line);
  }

  // --- Data flow arrows at edge midpoints ---
  const arrowGeo = new THREE.ConeGeometry(0.3, 0.8, 8);
  arrowGeo.rotateX(Math.PI / 2);
  const arrowMat = new THREE.MeshBasicMaterial({ color: 0xffee58 });
  const arrowMesh = new THREE.InstancedMesh(arrowGeo, arrowMat, edges.length);
  const arrowObj = new THREE.Object3D();
  const dir = new THREE.Vector3();
  for (let i = 0; i < edges.length; i++) {
    const e = edges[i];
    const mid = new THREE.Vector3().addVectors(e.start, e.end).multiplyScalar(0.5);
    // Arrow points from flow source to flow target
    if (e.flowReversed) {
      dir.subVectors(e.start, e.end).normalize();
    } else {
      dir.subVectors(e.end, e.start).normalize();
    }
    arrowObj.position.copy(mid);
    arrowObj.quaternion.setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir);
    arrowObj.updateMatrix();
    arrowMesh.setMatrixAt(i, arrowObj.matrix);
  }
  groups.arrows.add(arrowMesh);

  // --- Labels ---
  function makeTextSprite(text, fontSize = 64, color = '#ffffff') {
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    ctx.font = `bold ${fontSize}px monospace`;
    const metrics = ctx.measureText(text);
    canvas.width = Math.ceil(metrics.width) + 20;
    canvas.height = fontSize * 1.4;
    ctx.font = `bold ${fontSize}px monospace`;
    ctx.fillStyle = color;
    ctx.textBaseline = 'middle';
    ctx.fillText(text, 10, canvas.height / 2);
    const tex = new THREE.CanvasTexture(canvas);
    const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthTest: false });
    const sprite = new THREE.Sprite(mat);
    sprite.scale.set(canvas.width / canvas.height * 3, 3, 1);
    return sprite;
  }

  const entranceLabel = makeTextSprite('ENTRANCE', 64, '#ffee58');
  entranceLabel.position.set(102.8, 4.86, 40.0);
  entranceLabel.position.x += 4;
  scene.add(entranceLabel);

  // --- Nodes (small spheres) ---
  const nodeMap = collectNodes(edges);
  const dotGeo = new THREE.SphereGeometry(0.15, 8, 6);
  const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const instancedMesh = new THREE.InstancedMesh(dotGeo, dotMat, nodeMap.size);
  let idx = 0;
  const dummy = new THREE.Object3D();
  for (const n of nodeMap.values()) {
    dummy.position.copy(n.position);
    dummy.updateMatrix();
    instancedMesh.setMatrixAt(idx++, dummy.matrix);
  }
  groups.nodes.add(instancedMesh);

  // --- Node labels ---
  const labelColorMap = { Intercom: '#ff7043', ArtNet: '#4fc3f7', Regular: '#cccccc' };
  function rebuildLabels(scaleFactor) {
    while (groups.labels.children.length) groups.labels.remove(groups.labels.children[0]);
    if (scaleFactor <= 0) { groups.labels.visible = false; return; }
    groups.labels.visible = true;
    for (const n of nodeMap.values()) {
      const color = labelColorMap[n.type] || '#cccccc';
      const sprite = makeTextSprite(n.label, 48, color);
      sprite.position.copy(n.position);
      sprite.position.y += 0.6;
      sprite.scale.multiplyScalar(scaleFactor);
      groups.labels.add(sprite);
    }
  }

  // --- LED Rings ---
  const RING_TUBE = 0.03;
  const RING_SEGMENTS = 32;
  const RING_TUBE_SEGMENTS = 8;

  const nodeTypeColor = { Intercom: 0xff7043, ArtNet: 0x4fc3f7, Regular: 0x888888 };

  function createRings(nodeMap, filterType, diameter) {
    const groupKey = filterType === 'Intercom' ? 'intercomRings' : 'normalRings';
    const group = groups[groupKey];
    while (group.children.length) group.remove(group.children[0]);

    const radius = diameter / 2;
    const ringGeo = new THREE.TorusGeometry(radius, RING_TUBE, RING_TUBE_SEGMENTS, RING_SEGMENTS);

    const typesToDraw = filterType === 'Intercom' ? ['Intercom'] : ['ArtNet', 'Regular'];
    const positions = [];
    const colors = [];
    for (const n of nodeMap.values()) {
      if (!typesToDraw.includes(n.type)) continue;
      positions.push(n.position);
      colors.push(nodeTypeColor[n.type] || 0x4fc3f7);
    }
    if (positions.length === 0) return;

    for (let i = 0; i < positions.length; i++) {
      const ringMat = new THREE.MeshBasicMaterial({
        color: colors[i], transparent: true, opacity: 0.85
      });
      const mesh = new THREE.Mesh(ringGeo, ringMat);
      mesh.position.copy(positions[i]);
      mesh.rotation.set(Math.PI / 2, 0, 0);
      group.add(mesh);
    }
  }

  const defaultDiameter = edges[0]?.ringDiameter || 0.80;
  createRings(nodeMap, 'ArtNet', defaultDiameter);
  createRings(nodeMap, 'Intercom', defaultDiameter);

  // --- Stats ---
  let intercomCount = 0, artnetCount = 0, regularCount = 0;
  for (const n of nodeMap.values()) {
    if (n.type === 'Intercom') intercomCount++;
    else if (n.type === 'ArtNet') artnetCount++;
    else regularCount++;
  }
  document.getElementById('edgeCount').textContent = edges.length;
  document.getElementById('intercomCount').textContent = intercomCount;
  document.getElementById('artnetCount').textContent = artnetCount;
  document.getElementById('regularCount').textContent = regularCount;
  document.getElementById('nodeCount').textContent = nodeMap.size;

  return { scene, groups, nodeMap, createRings, rebuildLabels, defaultDiameter, stripMaterials, defaultTubeWidth };
}

async function main() {
  const edges = await loadCSV();
  hideStatus();

  const { scene, groups, nodeMap, createRings, rebuildLabels, defaultDiameter, stripMaterials, defaultTubeWidth } = buildScene(edges);

  const box = new THREE.Box3();
  for (const e of edges) { box.expandByPoint(e.start); box.expandByPoint(e.end); }
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(center.x + maxDim * 0.8, center.y + maxDim * 0.6, center.z + maxDim * 0.8);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(center);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.update();

  // --- GUI ---
  const params = {
    showEdges: true,
    showLEDTubes: true,
    showArrows: true,
    showNormalRings: true,
    showIntercomRings: true,
    showNodes: false,
    labelSize: 0.5,
    tubeDiameter: 0.2,
    intercomDiameter: 2.5,
  };

  const gui = new GUI({ title: 'Display' });
  gui.add(params, 'showEdges').name('Edges').onChange(v => { groups.edges.visible = v; });
  gui.add(params, 'showLEDTubes').name('LED Tubes').onChange(v => { groups.strips.visible = v; });
  gui.add(params, 'tubeDiameter', 0.02, 1.0, 0.01).name('LED Tube ⌀ (m)').onChange(v => {
    for (const mat of stripMaterials) mat.linewidth = v;
  });
  gui.add(params, 'showArrows').name('Data Flow Arrows').onChange(v => { groups.arrows.visible = v; });
  gui.add(params, 'showNormalRings').name('ArtNet/Regular Rings').onChange(v => { groups.normalRings.visible = v; });
  gui.add(params, 'showIntercomRings').name('Intercom Rings').onChange(v => { groups.intercomRings.visible = v; });
  gui.add(params, 'showNodes').name('Node Dots').onChange(v => { groups.nodes.visible = v; });
  gui.add(params, 'labelSize', 0, 3.0, 0.1).name('Label Size').onChange(v => { rebuildLabels(v); });
  gui.add(params, 'intercomDiameter', 0.1, 3.0, 0.01).name('Intercom ⌀ (m)').onChange(v => {
    createRings(nodeMap, 'Intercom', v);
  });
  const actions = { readme() { window.open('README.md', '_blank'); } };
  gui.add(actions, 'readme').name('Open README');

  // Apply defaults
  groups.nodes.visible = params.showNodes;
  rebuildLabels(params.labelSize);
  for (const mat of stripMaterials) mat.linewidth = params.tubeDiameter;
  createRings(nodeMap, 'Intercom', params.intercomDiameter);

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();
}

main().catch(err => showStatus('Error: ' + err.message));
</script>
</body>
</html>
