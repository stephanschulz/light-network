<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Edge Network 3D Viewer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; overflow: hidden; font-family: monospace; color: #ccc; }
  canvas { display: block; }
  #info {
    position: absolute; top: 12px; left: 12px;
    background: rgba(0,0,0,0.7); padding: 10px 14px; border-radius: 6px;
    font-size: 13px; line-height: 1.6; pointer-events: none;
  }
  #info .label { color: #888; }
  #status {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    font-size: 16px; color: #aaa; display: none;
  }
</style>
</head>
<body>
<div id="info">
  <span class="label">Edges:</span> <span id="edgeCount">0</span> &nbsp;
  <span class="label">Normal:</span> <span id="normalCount" style="color:#4fc3f7">0</span> &nbsp;
  <span class="label">Intercom:</span> <span id="intercomCount" style="color:#ff7043">0</span> &nbsp;
  <span class="label">Nodes:</span> <span id="nodeCount">0</span><br>
  <span class="label">Drag to rotate · Scroll to zoom · Right-drag to pan</span>
</div>
<div id="status">Loading CSV…</div>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.162.0",
    "three/addons/": "https://esm.sh/three@0.162.0/examples/jsm/",
    "lil-gui": "https://esm.sh/lil-gui@0.19.2"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineSegmentsGeometry } from 'three/addons/lines/LineSegmentsGeometry.js';
import GUI from 'lil-gui';

const statusEl = document.getElementById('status');
function showStatus(msg) { statusEl.style.display = 'block'; statusEl.textContent = msg; }
function hideStatus() { statusEl.style.display = 'none'; }

async function loadCSV() {
  showStatus('Loading CSV…');
  const resp = await fetch('edge_data_export.csv');
  if (!resp.ok) throw new Error(`Failed to load CSV: ${resp.status}`);
  const text = await resp.text();
  const lines = text.trim().split('\n');
  const edges = [];
  for (let i = 1; i < lines.length; i++) {
    const cols = lines[i].split(',');
    if (cols.length < 19) continue;
    edges.push({
      id: +cols[0],
      start: new THREE.Vector3(+cols[1], +cols[3], +cols[2]),
      end:   new THREE.Vector3(+cols[4], +cols[6], +cols[5]),
      length: +cols[7],
      ringDiameter: +cols[9],
      stripStart: new THREE.Vector3(+cols[10], +cols[12], +cols[11]),
      stripEnd:   new THREE.Vector3(+cols[13], +cols[15], +cols[14]),
      type: cols[18].trim()
    });
  }
  return edges;
}

function collectNodes(edges) {
  const nodeMap = new Map();
  for (const e of edges) {
    for (const pt of [e.start, e.end]) {
      const key = `${pt.x.toFixed(4)},${pt.y.toFixed(4)},${pt.z.toFixed(4)}`;
      if (!nodeMap.has(key)) {
        nodeMap.set(key, { position: pt.clone(), isIntercom: false, diameter: e.ringDiameter });
      }
      if (e.type === 'Intercom') nodeMap.get(key).isIntercom = true;
    }
  }
  return nodeMap;
}

function buildScene(edges) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x111111);

  const groups = {
    edges: new THREE.Group(),
    strips: new THREE.Group(),
    normalRings: new THREE.Group(),
    intercomRings: new THREE.Group(),
    nodes: new THREE.Group(),
  };
  groups.edges.name = 'edges';
  groups.strips.name = 'strips';
  groups.normalRings.name = 'normalRings';
  groups.intercomRings.name = 'intercomRings';
  groups.nodes.name = 'nodes';
  for (const g of Object.values(groups)) scene.add(g);

  const normalColor = new THREE.Color(0x4fc3f7);
  const intercomColor = new THREE.Color(0xff7043);
  let normalCount = 0, intercomCount = 0;

  // --- Thin edge lines ---
  const normalPositions = [];
  const intercomPositions = [];
  for (const e of edges) {
    const arr = e.type === 'Intercom' ? intercomPositions : normalPositions;
    arr.push(e.start.x, e.start.y, e.start.z, e.end.x, e.end.y, e.end.z);
    if (e.type === 'Intercom') intercomCount++; else normalCount++;
  }

  function makeLineSegments(positions, color) {
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    return new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color, linewidth: 1 }));
  }

  if (normalPositions.length) groups.edges.add(makeLineSegments(normalPositions, normalColor));
  if (intercomPositions.length) groups.edges.add(makeLineSegments(intercomPositions, intercomColor));

  // --- Fat strip / LED tube lines ---
  const stripNormalPos = [];
  const stripIntercomPos = [];
  for (const e of edges) {
    const arr = e.type === 'Intercom' ? stripIntercomPos : stripNormalPos;
    arr.push(e.stripStart.x, e.stripStart.y, e.stripStart.z, e.stripEnd.x, e.stripEnd.y, e.stripEnd.z);
  }

  function makeFatLineSegments(positions, color, width) {
    const geo = new LineSegmentsGeometry();
    geo.setPositions(positions);
    const mat = new LineMaterial({ color: color.getHex(), linewidth: width, worldUnits: true });
    return new Line2(geo, mat);
  }

  const stripMaterials = [];
  const defaultTubeWidth = 0.35;
  if (stripNormalPos.length) {
    const line = makeFatLineSegments(stripNormalPos, new THREE.Color(0x80deea), defaultTubeWidth);
    stripMaterials.push(line.material);
    groups.strips.add(line);
  }
  if (stripIntercomPos.length) {
    const line = makeFatLineSegments(stripIntercomPos, new THREE.Color(0xffab91), defaultTubeWidth);
    stripMaterials.push(line.material);
    groups.strips.add(line);
  }

  // --- Nodes (small spheres) ---
  const nodeMap = collectNodes(edges);
  const dotGeo = new THREE.SphereGeometry(0.15, 8, 6);
  const dotMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const instancedMesh = new THREE.InstancedMesh(dotGeo, dotMat, nodeMap.size);
  let idx = 0;
  const dummy = new THREE.Object3D();
  for (const n of nodeMap.values()) {
    dummy.position.copy(n.position);
    dummy.updateMatrix();
    instancedMesh.setMatrixAt(idx++, dummy.matrix);
  }
  groups.nodes.add(instancedMesh);

  // --- LED Rings ---
  const RING_TUBE = 0.03;
  const RING_SEGMENTS = 32;
  const RING_TUBE_SEGMENTS = 8;

  function createRings(nodeMap, filterIntercom, diameter) {
    const group = filterIntercom ? groups.intercomRings : groups.normalRings;
    while (group.children.length) group.remove(group.children[0]);

    const radius = diameter / 2;
    const ringGeo = new THREE.TorusGeometry(radius, RING_TUBE, RING_TUBE_SEGMENTS, RING_SEGMENTS);
    const ringMat = new THREE.MeshBasicMaterial({
      color: filterIntercom ? 0xff7043 : 0x4fc3f7,
      transparent: true,
      opacity: 0.85
    });

    const positions = [];
    for (const n of nodeMap.values()) {
      if (n.isIntercom !== filterIntercom) continue;
      positions.push(n.position);
    }

    if (positions.length === 0) return;

    const instanced = new THREE.InstancedMesh(ringGeo, ringMat, positions.length);
    const obj = new THREE.Object3D();
    for (let i = 0; i < positions.length; i++) {
      obj.position.copy(positions[i]);
      obj.rotation.set(Math.PI / 2, 0, 0);
      obj.updateMatrix();
      instanced.setMatrixAt(i, obj.matrix);
    }
    group.add(instanced);
  }

  const defaultDiameter = edges[0]?.ringDiameter || 0.80;
  createRings(nodeMap, false, defaultDiameter);
  createRings(nodeMap, true, defaultDiameter);

  // --- Stats ---
  document.getElementById('edgeCount').textContent = edges.length;
  document.getElementById('normalCount').textContent = normalCount;
  document.getElementById('intercomCount').textContent = intercomCount;
  document.getElementById('nodeCount').textContent = nodeMap.size;

  return { scene, groups, nodeMap, createRings, defaultDiameter, stripMaterials, defaultTubeWidth };
}

async function main() {
  const edges = await loadCSV();
  hideStatus();

  const { scene, groups, nodeMap, createRings, defaultDiameter, stripMaterials, defaultTubeWidth } = buildScene(edges);

  const box = new THREE.Box3();
  for (const e of edges) { box.expandByPoint(e.start); box.expandByPoint(e.end); }
  const center = box.getCenter(new THREE.Vector3());
  const size = box.getSize(new THREE.Vector3());
  const maxDim = Math.max(size.x, size.y, size.z);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(window.devicePixelRatio);
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.set(center.x + maxDim * 0.8, center.y + maxDim * 0.6, center.z + maxDim * 0.8);

  const controls = new OrbitControls(camera, renderer.domElement);
  controls.target.copy(center);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.update();

  // --- GUI ---
  const params = {
    showEdges: true,
    showLEDTubes: true,
    showNormalRings: true,
    showIntercomRings: true,
    showNodes: true,
    tubeDiameter: defaultTubeWidth,
    intercomDiameter: defaultDiameter,
  };

  const gui = new GUI({ title: 'Display' });
  gui.add(params, 'showEdges').name('Edges').onChange(v => { groups.edges.visible = v; });
  gui.add(params, 'showLEDTubes').name('LED Tubes').onChange(v => { groups.strips.visible = v; });
  gui.add(params, 'tubeDiameter', 0.02, 1.0, 0.01).name('LED Tube ⌀ (m)').onChange(v => {
    for (const mat of stripMaterials) mat.linewidth = v;
  });
  gui.add(params, 'showNormalRings').name('Normal Rings').onChange(v => { groups.normalRings.visible = v; });
  gui.add(params, 'showIntercomRings').name('Intercom Rings').onChange(v => { groups.intercomRings.visible = v; });
  gui.add(params, 'showNodes').name('Node Dots').onChange(v => { groups.nodes.visible = v; });
  gui.add(params, 'intercomDiameter', 0.1, 3.0, 0.01).name('Intercom ⌀ (m)').onChange(v => {
    createRings(nodeMap, true, v);
  });

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  (function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
  })();
}

main().catch(err => showStatus('Error: ' + err.message));
</script>
</body>
</html>
