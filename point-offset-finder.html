<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Point Offset Finder</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            font-size: 1.8rem;
            color: #00ffa3;
            margin-bottom: 20px;
            font-weight: 400;
            letter-spacing: 2px;
        }
        
        .stats-panel {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: linear-gradient(135deg, #1a1a24 0%, #12121a 100%);
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 16px 20px;
        }
        
        .stat-card h3 {
            font-size: 0.75rem;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }
        
        .stat-card .value {
            font-size: 1.4rem;
            font-weight: 600;
        }
        
        .stat-card .value.stephan { color: #ff6b6b; }
        .stat-card .value.intercom { color: #4ecdc4; }
        .stat-card .value.offset { color: #ffd93d; }
        .stat-card .value.corrected { color: #a855f7; }
        
        .stat-card .detail {
            font-size: 0.85rem;
            color: #888;
            margin-top: 4px;
        }
        
        .canvas-container {
            background: linear-gradient(180deg, #0d0d14 0%, #08080c 100%);
            border: 1px solid #2a2a3a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 24px;
        }
        
        canvas {
            display: block;
            width: 100%;
            background: #050508;
            border-radius: 8px;
        }
        
        .legend {
            display: flex;
            gap: 32px;
            justify-content: center;
            margin-top: 16px;
            flex-wrap: wrap;
        }
        
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }
        
        .legend-dot {
            width: 14px;
            height: 14px;
            border-radius: 50%;
        }
        
        .legend-dot.stephan { background: #ff6b6b; }
        .legend-dot.intercom { background: #4ecdc4; }
        .legend-dot.corrected { background: #a855f7; }
        
        .controls {
            background: linear-gradient(135deg, #1a1a24 0%, #12121a 100%);
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 16px 20px;
            margin-bottom: 24px;
        }
        
        .controls label {
            display: block;
            font-size: 0.85rem;
            color: #888;
            margin-bottom: 8px;
        }
        
        .controls input[type="range"] {
            width: 100%;
            margin-bottom: 8px;
        }
        
        .controls .range-value {
            text-align: center;
            font-size: 1.2rem;
            color: #ffd93d;
        }
        
        .toggle-btn {
            background: #2a2a3a;
            border: 1px solid #3a3a4a;
            color: #e0e0e0;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            margin-right: 8px;
            margin-top: 12px;
        }
        
        .toggle-btn:hover {
            background: #3a3a4a;
        }
        
        .toggle-btn.active {
            background: #00ffa3;
            color: #0a0a0f;
            border-color: #00ffa3;
        }
        
        .data-table {
            background: linear-gradient(135deg, #1a1a24 0%, #12121a 100%);
            border: 1px solid #2a2a3a;
            border-radius: 8px;
            padding: 16px;
            overflow-x: auto;
        }
        
        .data-table h3 {
            color: #00ffa3;
            margin-bottom: 12px;
            font-weight: 400;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }
        
        th, td {
            padding: 8px 12px;
            text-align: left;
            border-bottom: 1px solid #2a2a3a;
        }
        
        th {
            color: #888;
            font-weight: 500;
            text-transform: uppercase;
            font-size: 0.75rem;
        }
        
        td.stephan { color: #ff6b6b; }
        td.intercom { color: #4ecdc4; }
        td.corrected { color: #a855f7; }
    </style>
</head>

            <button class="toggle-btn active" id="showIntercom">Intercom (Original)</button>
            <button class="toggle-btn active" id="showCorrected">Intercom (Corrected)</button>
            <button class="toggle-btn" id="autoFit">Auto-Fit Offset</button>

        </div>

        // Parse CSV helper
        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            const headers = lines[0].split(',').map(h => h.trim());
            const data = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',');
                const row = {};
                headers.forEach((h, idx) => {
                    row[h] = values[idx] ? values[idx].trim() : '';
                });
                data.push(row);
            }
            return data;
        }

        // Parse the data
        const intercomData = parseCSV(intercomCSV);
        const stephanData = parseCSV(stephanCSV);

        // Extract intercom points
        const intercomPoints = intercomData
            .filter(row => row.X && row.Y && row.Z)
            .map(row => ({
                x: parseFloat(row.X),
                y: parseFloat(row.Y),
                z: parseFloat(row.Z)
            }));

        // Extract stephan points (unique from start and end)
        const stephanPointsMap = new Map();
        stephanData.forEach(row => {
            if (row.start_X && row.start_Y && row.start_Z) {
                const key = `${row.start_X},${row.start_Y},${row.start_Z}`;
                if (!stephanPointsMap.has(key)) {
                    stephanPointsMap.set(key, {
                        x: parseFloat(row.start_X),
                        y: parseFloat(row.start_Y),
                        z: parseFloat(row.start_Z)
                    });
                }
            }
            if (row.end_X && row.end_Y && row.end_Z) {
                const key = `${row.end_X},${row.end_Y},${row.end_Z}`;
                if (!stephanPointsMap.has(key)) {
                    stephanPointsMap.set(key, {
                        x: parseFloat(row.end_X),
                        y: parseFloat(row.end_Y),
                        z: parseFloat(row.end_Z)
                    });
                }
            }
        });
        const stephanPoints = Array.from(stephanPointsMap.values());

        // Calculate statistics
        const intercomYValues = intercomPoints.map(p => p.y);
        const stephanYValues = stephanPoints.map(p => p.y);

        const intercomYMin = Math.min(...intercomYValues);
        const intercomYMax = Math.max(...intercomYValues);
        const intercomYMean = intercomYValues.reduce((a, b) => a + b, 0) / intercomYValues.length;

        const stephanYMin = Math.min(...stephanYValues);
        const stephanYMax = Math.max(...stephanYValues);
        const stephanYMean = stephanYValues.reduce((a, b) => a + b, 0) / stephanYValues.length;

        // Calculate X ranges for reference
        const intercomXValues = intercomPoints.map(p => p.x);
        const stephanXValues = stephanPoints.map(p => p.x);
        const intercomXMin = Math.min(...intercomXValues);
        const intercomXMax = Math.max(...intercomXValues);
        const stephanXMin = Math.min(...stephanXValues);
        const stephanXMax = Math.max(...stephanXValues);

        // Calculate offsets
        const yOffsetByMean = stephanYMean - intercomYMean;
        const yOffsetByMin = stephanYMin - intercomYMin;
        const yOffsetByMax = stephanYMax - intercomYMax;

        // Best estimate: align the ranges
        // Intercom Y range: intercomYMin to intercomYMax
        // Stephan Y range: stephanYMin to stephanYMax
        // If intercom sits "under", we need to shift it up
        const calculatedOffset = yOffsetByMean;

        let manualOffset = calculatedOffset;

        // Display settings
        let showStephan = true;
        let showIntercom = true;
        let showCorrected = true;

        // Populate stats panel
        function updateStats() {
            document.getElementById('statsPanel').innerHTML = `
                <div class="stat-card">
                    <h3>Stephan Points</h3>
                    <div class="value stephan">${stephanPoints.length} points</div>
                    <div class="detail">Y range: ${stephanYMin.toFixed(3)} to ${stephanYMax.toFixed(3)}</div>
                    <div class="detail">Y mean: ${stephanYMean.toFixed(3)}</div>
                </div>
                <div class="stat-card">
                    <h3>Intercom Points</h3>
                    <div class="value intercom">${intercomPoints.length} points</div>
                    <div class="detail">Y range: ${intercomYMin.toFixed(3)} to ${intercomYMax.toFixed(3)}</div>
                    <div class="detail">Y mean: ${intercomYMean.toFixed(3)}</div>
                </div>
                <div class="stat-card">
                    <h3>Calculated Y Offset (by mean)</h3>
                    <div class="value offset">${yOffsetByMean.toFixed(3)}</div>
                    <div class="detail">Intercom Y + ${yOffsetByMean.toFixed(3)} → aligned</div>
                </div>
                <div class="stat-card">
                    <h3>Current Y Offset</h3>
                    <div class="value corrected">${manualOffset.toFixed(3)}</div>
                    <div class="detail">Applied to intercom points</div>
                </div>
            `;
        }

        // Canvas setup
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function draw() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = canvas.clientWidth * dpr;
            canvas.height = canvas.clientHeight * dpr;
            ctx.scale(dpr, dpr);

            const width = canvas.clientWidth;
            const height = canvas.clientHeight;
            const padding = 60;

            // Clear
            ctx.fillStyle = '#050508';
            ctx.fillRect(0, 0, width, height);

            // Calculate bounds (include all points with offset)
            const allX = [...stephanXValues, ...intercomXValues];
            const allY = [...stephanYValues, ...intercomYValues, ...intercomYValues.map(y => y + manualOffset)];
            
            const xMin = Math.min(...allX) - 5;
            const xMax = Math.max(...allX) + 5;
            const yMin = Math.min(...allY) - 5;
            const yMax = Math.max(...allY) + 5;

            // Scale functions
            const scaleX = (x) => padding + ((x - xMin) / (xMax - xMin)) * (width - 2 * padding);
            const scaleY = (y) => height - padding - ((y - yMin) / (yMax - yMin)) * (height - 2 * padding);

            // Draw grid
            ctx.strokeStyle = '#1a1a2a';
            ctx.lineWidth = 1;
            
            // Vertical grid lines
            for (let x = Math.ceil(xMin / 10) * 10; x <= xMax; x += 10) {
                ctx.beginPath();
                ctx.moveTo(scaleX(x), padding);
                ctx.lineTo(scaleX(x), height - padding);
                ctx.stroke();
            }
            
            // Horizontal grid lines
            for (let y = Math.ceil(yMin / 10) * 10; y <= yMax; y += 10) {
                ctx.beginPath();
                ctx.moveTo(padding, scaleY(y));
                ctx.lineTo(width - padding, scaleY(y));
                ctx.stroke();
            }

            // Draw axes labels
            ctx.fillStyle = '#666';
            ctx.font = '11px JetBrains Mono, monospace';
            ctx.textAlign = 'center';
            
            for (let x = Math.ceil(xMin / 20) * 20; x <= xMax; x += 20) {
                ctx.fillText(x.toFixed(0), scaleX(x), height - padding + 20);
            }
            
            ctx.textAlign = 'right';
            for (let y = Math.ceil(yMin / 20) * 20; y <= yMax; y += 20) {
                ctx.fillText(y.toFixed(0), padding - 10, scaleY(y) + 4);
            }

            // Axis labels
            ctx.fillStyle = '#888';
            ctx.font = '12px JetBrains Mono, monospace';
            ctx.textAlign = 'center';
            ctx.fillText('X', width / 2, height - 15);
            ctx.save();
            ctx.translate(15, height / 2);
            ctx.rotate(-Math.PI / 2);
            ctx.fillText('Y', 0, 0);
            ctx.restore();

            // Draw points
            // Stephan points (red)
            if (showStephan) {
                ctx.fillStyle = '#ff6b6b';
                stephanPoints.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(scaleX(p.x), scaleY(p.y), 3, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Intercom original (cyan)
            if (showIntercom) {
                ctx.fillStyle = '#4ecdc4';
                intercomPoints.forEach(p => {
                    ctx.beginPath();
                    ctx.arc(scaleX(p.x), scaleY(p.y), 6, 0, Math.PI * 2);
                    ctx.fill();
                });
            }

            // Intercom corrected (purple)
            if (showCorrected) {
                ctx.fillStyle = '#a855f7';
                ctx.strokeStyle = '#a855f7';
                ctx.lineWidth = 2;
                intercomPoints.forEach(p => {
                    const correctedY = p.y + manualOffset;
                    ctx.beginPath();
                    ctx.arc(scaleX(p.x), scaleY(correctedY), 8, 0, Math.PI * 2);
                    ctx.stroke();
                    
                    // Draw connection line from original to corrected
                    if (showIntercom) {
                        ctx.beginPath();
                        ctx.setLineDash([4, 4]);
                        ctx.moveTo(scaleX(p.x), scaleY(p.y));
                        ctx.lineTo(scaleX(p.x), scaleY(correctedY));
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                });
            }
        }

        // Update table
        function updateTable() {
            const tbody = document.querySelector('#comparisonTable tbody');
            tbody.innerHTML = intercomPoints.map((p, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td class="intercom">${p.x.toFixed(3)}</td>
                    <td class="intercom">${p.y.toFixed(3)}</td>
                    <td class="intercom">${p.z.toFixed(3)}</td>
                    <td class="corrected">${(p.y + manualOffset).toFixed(3)}</td>
                    <td class="offset">${manualOffset.toFixed(3)}</td>
                </tr>
            `).join('');
        }

        // Event handlers
        const slider = document.getElementById('offsetSlider');
        slider.value = calculatedOffset;
        
        slider.addEventListener('input', () => {
            manualOffset = parseFloat(slider.value);
            document.getElementById('sliderValue').textContent = manualOffset.toFixed(3);
            updateStats();
            updateTable();
            draw();
        });

        document.getElementById('showStephan').addEventListener('click', function() {
            showStephan = !showStephan;
            this.classList.toggle('active');
            draw();
        });

        document.getElementById('showIntercom').addEventListener('click', function() {
            showIntercom = !showIntercom;
            this.classList.toggle('active');
            draw();
        });

        document.getElementById('showCorrected').addEventListener('click', function() {
            showCorrected = !showCorrected;
            this.classList.toggle('active');
            draw();
        });

        document.getElementById('autoFit').addEventListener('click', function() {
            manualOffset = calculatedOffset;
            slider.value = calculatedOffset;
            document.getElementById('sliderValue').textContent = calculatedOffset.toFixed(3);
            updateStats();
            updateTable();
            draw();
        });

        // Initial render
        document.getElementById('sliderValue').textContent = calculatedOffset.toFixed(3);
        updateStats();
        updateTable();
        draw();

        // Resize handler
        window.addEventListener('resize', draw);

        // Log results to console
        console.log('=== OFFSET ANALYSIS ===');
        console.log(`Intercom points: ${intercomPoints.length}`);
        console.log(`Stephan points: ${stephanPoints.length}`);
        console.log(`\nIntercom Y range: ${intercomYMin.toFixed(3)} to ${intercomYMax.toFixed(3)} (mean: ${intercomYMean.toFixed(3)})`);
        console.log(`Stephan Y range: ${stephanYMin.toFixed(3)} to ${stephanYMax.toFixed(3)} (mean: ${stephanYMean.toFixed(3)})`);
        console.log(`\nCalculated Y offset (by mean): ${yOffsetByMean.toFixed(3)}`);
        console.log(`Y offset (by min): ${yOffsetByMin.toFixed(3)}`);
        console.log(`Y offset (by max): ${yOffsetByMax.toFixed(3)}`);
    </script>
</body>
</html>
